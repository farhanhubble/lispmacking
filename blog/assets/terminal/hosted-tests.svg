<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="285" viewBox="0 0 1040 285" role="img" aria-labelledby="title desc">
<title id="title">Hosted evaluator and assembler tests</title>
<desc id="desc">Terminal output rendered from a real project command.</desc>
<rect width="100%" height="100%" rx="18" fill="#111719"/>
<circle cx="34" cy="34" r="7" fill="#d76c62"/><circle cx="58" cy="34" r="7" fill="#e6a14a"/><circle cx="82" cy="34" r="7" fill="#54b9b1"/>
<text x="520.0" y="43" fill="#aeb9b6" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">Hosted evaluator and assembler tests</text>
<line x1="20" y1="64" x2="1020" y2="64" stroke="#314044" stroke-width="2"/>
<text x="36" y="98" fill="#54b9b1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">$ make test</text>
<text x="36" y="152" fill="#e6a14a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" xml:space="preserve">hosted Lisp assembler tests passed</text>
<text x="36" y="179" fill="#f3ead8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" xml:space="preserve">./build/vm-tests</text>
<text x="36" y="206" fill="#e6a14a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" xml:space="preserve">all VM tests passed</text>
</svg>
