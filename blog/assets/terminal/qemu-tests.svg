<text x="36" y="746" fill="#f3ead8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" xml:space="preserve">2281689088</text>
<text x="36" y="773" fill="#f3ead8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" xml:space="preserve">lisp&gt; (compiler-compile-program rejected-page &#x27;((bad (x) missing)))</text>
