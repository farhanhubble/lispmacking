<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="960" viewBox="0 0 1332 960" role="img" aria-labelledby="title desc">
<title id="title">Native compiler on QEMU RV64</title>
<desc id="desc">Terminal output rendered from a real project command.</desc>
