<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title desc">
<title id="title">Inside the Lisp machine</title>
<desc id="desc">QEMU emulates an RV64 CPU, RAM and UART. Inside the guest, Lisp compiler and assembler programs are interpreted by the C evaluator above the bare-metal platform adapter. The tools emit instructions into a RAM code page; bootstrap:call-native enters that code on the emulated CPU. All guest code currently runs in machine mode, without a guest OS.</desc>
